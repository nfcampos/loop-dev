<svg width="1500" height="860" viewBox="0 0 1500 860" xmlns="http://www.w3.org/2000/svg">
  <rect width="1500" height="860" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9a9aa0"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="750" y="46" font-family="Helvetica, Arial, sans-serif" font-size="32" font-weight="bold" fill="#1d1d1f" text-anchor="middle">The corpus-bench loop</text>

  <!-- Phase 1 caption -->
  <text x="150" y="96" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#6e6e73">1 · Produce the signal — once per corpus</text>

  <!-- Corpus box -->
  <rect x="150" y="110" width="440" height="110" rx="14" fill="#f5f5f7"/>
  <text x="370" y="158" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="#1d1d1f" text-anchor="middle">Public corpus</text>
  <text x="370" y="194" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#6e6e73" text-anchor="middle">15,970 real-world workbooks</text>

  <!-- Excel truth box (oracle, green) -->
  <rect x="820" y="110" width="520" height="110" rx="14" fill="#e9f6ef" stroke="#1a7f4e" stroke-width="3"/>
  <text x="1080" y="158" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="#136b41" text-anchor="middle">Real Excel recalculates every file</text>
  <text x="1080" y="194" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#4d8a6c" text-anchor="middle">frozen ground truth — generated once</text>

  <!-- corpus -> excel -->
  <line x1="590" y1="165" x2="812" y2="165" stroke="#9a9aa0" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Phase 2 caption -->
  <text x="150" y="330" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#6e6e73">2 · Hill-climb — every run after</text>

  <!-- corpus -> engines -->
  <line x1="500" y1="220" x2="500" y2="352" stroke="#9a9aa0" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="516" y="296" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#6e6e73">same files</text>

  <!-- excel truth -> comparator -->
  <line x1="1080" y1="220" x2="1080" y2="352" stroke="#9a9aa0" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="1096" y="296" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#6e6e73">frozen truth</text>

  <!-- Loop box: engines (top-left) -->
  <rect x="150" y="360" width="480" height="130" rx="14" fill="#f5f5f7"/>
  <text x="390" y="415" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="#1d1d1f" text-anchor="middle">Five engines run the same files</text>
  <text x="390" y="451" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#6e6e73" text-anchor="middle">open · save→reopen · recalculate</text>

  <!-- Loop box: comparator (top-right) -->
  <rect x="820" y="360" width="520" height="130" rx="14" fill="#f5f5f7"/>
  <text x="1080" y="415" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="#1d1d1f" text-anchor="middle">One shared comparator, one universe</text>
  <text x="1080" y="451" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#6e6e73" text-anchor="middle">per-cell vs frozen truth, 1e-9 tolerance</text>

  <!-- Loop box: failure reports (bottom-right) -->
  <rect x="820" y="660" width="520" height="130" rx="14" fill="#f5f5f7"/>
  <text x="1080" y="715" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="#1d1d1f" text-anchor="middle">Reports + per-file receipts</text>
  <text x="1080" y="751" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#6e6e73" text-anchor="middle">failure reports become the work queue</text>

  <!-- Loop box: agent fixes (bottom-left) -->
  <rect x="150" y="660" width="480" height="130" rx="14" fill="#f5f5f7"/>
  <text x="390" y="715" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="#1d1d1f" text-anchor="middle">Agent fixes the engine</text>
  <text x="390" y="751" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#6e6e73" text-anchor="middle">in priority order, tests with every fix</text>

  <!-- Loop arrows (clockwise) -->
  <line x1="630" y1="425" x2="812" y2="425" stroke="#9a9aa0" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1080" y1="490" x2="1080" y2="652" stroke="#9a9aa0" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="820" y1="725" x2="638" y2="725" stroke="#9a9aa0" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="390" y1="660" x2="390" y2="498" stroke="#9a9aa0" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="406" y="585" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#6e6e73">re-run — gaps → zero</text>
</svg>
